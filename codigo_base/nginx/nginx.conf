events {
    worker_connections 1024;
}

http {
    # Módulo split_clients: distribución probabilística determinista por IP
    split_clients "${remote_addr}${http_user_agent}SEED" $backend_upstream {
        10%     app-canary:8080;   # 10% Tráfico Canary
        *       app-stable:8080;   # 90% Tráfico Stable
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            # Soporte de override para ingenieros/pruebas vía Header HTTP
            set $target_backend $backend_upstream;
            if ($http_x_canary_force = "true") {
                set $target_backend app-canary:8080;
            }

            proxy_pass http://$target_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cabecera de auditoría para verificar qué backend atendió
            add_header X-Served-By $target_backend always;
        }
    }
}

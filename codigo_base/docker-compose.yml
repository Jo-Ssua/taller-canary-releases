version: '3.8'

services:
  canary-router:
    image: nginx:1.25-alpine
    container_name: canary-router
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app-stable
      - app-canary
    networks:
      - canary-net

  app-stable:
    build: ./app-v1
    container_name: app-stable
    ports:
      - "8081:8080"
    environment:
      - APP_ENV=STABLE
      - APP_VERSION=1.0.0
      - APP_COLOR=#1E3A8A
    networks:
      - canary-net

  app-canary:
    build: ./app-v2
    container_name: app-canary
    ports:
      - "8082:8080"
    environment:
      - APP_ENV=CANARY
      - APP_VERSION=2.0.0
      - APP_COLOR=#D97706
    networks:
      - canary-net

networks:
  canary-net:
    driver: bridge
